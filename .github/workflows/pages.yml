name: Publish Awesome Micro Theory

on:
  push:
    branches: [main]
  schedule:
    - cron: '37 1 * * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh from the public catalogue before publishing
        required: false
        type: boolean
        default: true

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: pages
        uses: actions/configure-pages@v5
      - name: Refresh the public snapshot
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: node scripts/sync-public.mjs
      - name: Build the static website
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          node scripts/sync-public.mjs --check
          node scripts/check-pages-data.mjs
          node scripts/build.mjs --base "${PAGES_BASE%/}/"
      - name: Verify the public site
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          node scripts/check-pages-navigation.mjs "${PAGES_BASE%/}/"
          node scripts/verify-release.mjs "${PAGES_BASE%/}/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
